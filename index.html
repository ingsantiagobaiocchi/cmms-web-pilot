<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/cmms-web-pilot/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="MANTS: sistema CMMS preventivo para la gestión de activos, planes y órdenes de trabajo.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MANTS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=mants-round-1">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=mants-round-1"/>

  <meta name="theme-color" content="#0B2A6B">
  <title>MANTS</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <style>
    body { margin: 0; background: #f7f9fc; }
    #mants-startup { position: fixed; inset: 0; display: grid; place-items: center;
      font: 16px Arial, sans-serif; color: #0b2a6b; padding: 32px; }
    .mants-startup-content { width: min(100%, 360px); text-align: center; }
    .mants-route { position: relative; height: 50px; margin: 32px 0 24px;
      border-bottom: 3px solid #e8eef6; }
    .mants-walker { position: absolute; width: 48px; bottom: 0; left: 0;
      animation: mants-walk 2.6s ease-in-out infinite; }
    @keyframes mants-walk { to { left: calc(100% - 48px); } }
    @media(prefers-reduced-motion: reduce) { .mants-walker { animation: none; left: calc(50% - 24px); } }
  </style>
  <div id="mants-startup" role="status" aria-label="Iniciando MANTS">
    <div class="mants-startup-content">
      <img src="branding/logo.svg" width="280" style="max-width:100%" alt="MANTS">
      <div class="mants-route"><img class="mants-walker" src="branding/ant.svg" alt=""></div>
      <h2>Iniciando MANTS</h2><p>Cargando recursos…</p>
      <p id="mants-startup-error" hidden>No se pudo iniciar MANTS. Revisa la conexión y
        <button onclick="location.reload()">Reintentar</button></p>
    </div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
