<!DOCTYPE html>
<html lang="es">
<head>
  <base href="/cmms-web-pilot/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Restablecer datos locales · CMMS</title>
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; }
    body {
      align-items: center;
      background: #f4f6f9;
      color: #17283a;
      display: flex;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }
    main {
      background: white;
      border: 1px solid #d9e0e7;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgb(23 40 58 / 10%);
      max-width: 560px;
      padding: 32px;
    }
    h1 { font-size: 24px; margin: 0 0 16px; }
    p { line-height: 1.55; }
    button {
      background: #315c85;
      border: 0;
      border-radius: 10px;
      color: white;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      margin-top: 12px;
      padding: 12px 18px;
    }
    button:disabled { cursor: wait; opacity: .65; }
    #status { min-height: 24px; }
  </style>
</head>
<body>
  <main>
    <h1>Restablecer datos locales del CMMS</h1>
    <p>
      Esta acción elimina únicamente la base Drift y los archivos temporales
      guardados por este navegador. No modifica la organización ni los datos
      existentes en Supabase.
    </p>
    <button id="reset" type="button">Limpiar datos locales y volver al CMMS</button>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script>
    const button = document.querySelector('#reset');
    const status = document.querySelector('#status');

    async function deleteIndexedDatabases() {
      if (!indexedDB.databases) return;
      const databases = await indexedDB.databases();
      await Promise.all(databases
        .filter((database) => database.name)
        .map((database) => new Promise((resolve, reject) => {
          const request = indexedDB.deleteDatabase(database.name);
          request.onsuccess = () => resolve();
          request.onerror = () => reject(request.error);
          request.onblocked = () => reject(new Error('La base local sigue en uso.'));
        })));
    }

    async function deleteOpfsDatabase() {
      if (!navigator.storage?.getDirectory) return;
      const root = await navigator.storage.getDirectory();
      try {
        await root.removeEntry('drift_db', { recursive: true });
      } catch (error) {
        if (error.name !== 'NotFoundError') throw error;
      }
    }

    button.addEventListener('click', async () => {
      button.disabled = true;
      status.textContent = 'Limpiando datos locales…';
      try {
        const registrations = navigator.serviceWorker
          ? await navigator.serviceWorker.getRegistrations()
          : [];
        await Promise.all(registrations.map((registration) => registration.unregister()));
        const cacheNames = 'caches' in window ? await caches.keys() : [];
        await Promise.all(cacheNames.map((name) => caches.delete(name)));
        await deleteIndexedDatabases();
        await deleteOpfsDatabase();
        status.textContent = 'Limpieza completada. Volviendo al CMMS…';
        window.location.replace(`./?local-reset=${Date.now()}`);
      } catch (error) {
        button.disabled = false;
        status.textContent = `No se pudo completar la limpieza: ${error.message}`;
      }
    });
  </script>
</body>
</html>
